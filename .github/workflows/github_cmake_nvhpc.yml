name: CMake build with NVHPC

on:
  pull_request:
  push:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvhpc-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yaml-support: ["OFF" , "ON"]
    steps:
    - name: Cache compiler and dependencies
      id: cache
      uses: actions/cache@v5.1.0
      with:
        path: /opt/view
        key: nvhpc-ubuntu-latest
    - name: Checkout
      uses: actions/checkout@v4.2.2
    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
    - name: Setup Spack
      uses: spack/setup-spack@v3.0.0
      with:
        buildcache: true
        spack_ref: v1.2.0 # spack branch to use
    - name: Install NVHPC compilers and dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        spack compiler find
        spack env create --with-view /opt/view gpu-env
        spack -e gpu-env add nvhpc netcdf-fortran%nvhpc mpich%nvhpc libyaml%nvhpc target=x86_64
        spack -e gpu-env install
    - name: Configure
      run: |
        . /home/runner/work/FMS/FMS/spack/share/spack/setup-env.sh
        spack load nvhpc netcdf-c netcdf-fortran libyaml mpich
        export FC=mpifort FCFLAGS="-O0 -g `nf-config --fflags` `nf-config --flibs`"
        export CC=mpicc CFLAGS="-O0 -g `nc-config --cflags` `pkg-config --cflags yaml-0.1` `nc-config --libs`"
        export LDFLAGS="`nc-config --libs` `nf-config --flibs`"
        export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:`nc-config --libdir`:`nf-config --prefix`/lib64"
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE="Debug" -DWITH_YAML="${{ matrix.yaml-support }}" ..
    - name: Compile
      run: |
        . /home/runner/work/FMS/FMS/spack/share/spack/setup-env.sh
        spack load nvhpc netcdf-c netcdf-fortran libyaml mpich
        cd build
        make -j
