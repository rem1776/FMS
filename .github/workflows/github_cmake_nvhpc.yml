name: Autotools build and unit testing with NVHPC

on: push
# cancel running jobs if theres a newer push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-autotools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
    - name: Setup Spack
      uses: spack/setup-spack@v3.0.0
    - name: checkout
      uses: actions/checkout@v4.2.2
    - name: Set up build cache and build compiler
      run: |
        spack mirror add \
            --autopush \
            --oci-username-variable rem1776 \
            --oci-password-variable ${{ secrets.GITHUB_TOKEN }} \
            rem-gh-cache oci://ghcr.io/rem1776/ci-cache-ubuntu
        spack compiler find
        spack install nvhpc
    - name: Install dependencies
      run: |
        spack compiler find
        spack install netcdf-fortran %nvhpc mpich %nvhpc libyaml %nvhpc
    - name: Configure
      run: |
        spack load nvhpc netcdf-fortran libyaml mpich
        autoreconf -if ./configure.ac
        ./configure --with-yaml
    - name: Compile
      run: |
        spack load nvhpc netcdf-fortran libyaml mpich
        make -j || make
    - name: Run test suite
      run: |
        spack load nvhpc netcdf-fortran libyaml mpich
        make check TEST_VERBOSE=1
